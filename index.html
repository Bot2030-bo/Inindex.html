<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ICHANCY STORAGE | العجلة الذهبية</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Tahoma', system-ui;
    -webkit-tap-highlight-color: transparent;
}
body {
    background: radial-gradient(circle at 30% 10%, #0a0f1e, #030614);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
}
.container {
    max-width: 520px;
    width: 100%;
    margin: auto;
    background: rgba(5, 10, 25, 0.55);
    backdrop-filter: blur(14px);
    border-radius: 55px;
    padding: 20px 18px 30px;
    border: 1px solid rgba(255, 215, 0, 0.35);
    box-shadow: 0 25px 45px rgba(0,0,0,0.5);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.5);
    border-radius: 100px;
    padding: 8px 18px;
    margin-bottom: 20px;
}
.logo {
    font-size: 20px;
    font-weight: bold;
    background: linear-gradient(135deg, #ffd966, #ffb347);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
.balance {
    background: #0a2a3f;
    padding: 6px 14px;
    border-radius: 40px;
    color: #ffd966;
    font-weight: bold;
    border: 1px solid #1e6f9f;
}
.stats-row {
    display: flex;
    justify-content: space-between;
    background: rgba(255,255,255,0.05);
    padding: 10px 18px;
    border-radius: 60px;
    margin-bottom: 22px;
    font-size: 13px;
}
.wheel-box {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 10px auto;
}
@media (min-width: 470px) {
    .wheel-box { width: 320px; height: 320px; }
}
canvas {
    width: 100% !important;
    height: 100% !important;
    border-radius: 50%;
    box-shadow: 0 0 0 6px rgba(255,215,0,0.3), 0 15px 35px black;
    transition: transform 4s cubic-bezier(0.2, 0.95, 0.1, 1);
    background: #0e1622;
}
.pointer {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 44px solid #fbbf24;
    filter: drop-shadow(0 4px 6px black);
    z-index: 12;
}
.spin-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 78px;
    height: 78px;
    background: radial-gradient(circle, #ffd966, #f59e0b);
    border: 3px solid white;
    border-radius: 50%;
    font-weight: bold;
    font-size: 20px;
    cursor: pointer;
    z-index: 20;
    box-shadow: 0 0 18px gold;
}
.actions {
    display: flex;
    gap: 12px;
    margin: 24px 0 15px;
}
.actions button {
    flex: 1;
    background: #1e2a3a;
    border: none;
    padding: 12px;
    border-radius: 50px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid rgba(255,215,0,0.4);
}
.admin-panel {
    margin-top: 20px;
    background: #0f1422cc;
    backdrop-filter: blur(10px);
    border-radius: 32px;
    padding: 18px;
    border: 1px solid #fbbf24;
    display: none;
}
.admin-panel input, .admin-panel select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 50px;
    background: #111827;
    border: none;
    color: white;
    text-align: center;
}
.admin-panel button {
    width: 100%;
    background: #fbbf24;
    border: none;
    padding: 10px;
    border-radius: 50px;
    font-weight: bold;
    margin-bottom: 10px;
    cursor: pointer;
}
.message {
    background: #14532d;
    padding: 12px;
    border-radius: 40px;
    text-align: center;
    display: none;
    margin-top: 12px;
}
.error { background: #7f1d1d; }
.login-overlay {
    position: fixed;
    inset: 0;
    background: #020617ee;
    backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20000;
}
.login-card {
    width: 88%;
    max-width: 360px;
    background: #0f172a;
    border-radius: 55px;
    padding: 30px 24px;
    text-align: center;
    border: 1px solid #fbbf24;
}
.login-card input {
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    border-radius: 60px;
    background: #1e293b;
    border: none;
    color: white;
    text-align: center;
}
.login-card button {
    width: 100%;
    background: #fbbf24;
    border: none;
    padding: 12px;
    border-radius: 60px;
    font-weight: bold;
    margin-top: 8px;
}
.king-modal {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 30000;
}
.king-modal h1 {
    font-size: 42px;
    color: gold;
    text-shadow: 0 0 20px gold;
}
.fake-toast {
    position: fixed;
    left: 16px;
    bottom: 20px;
    background: #0f172a;
    border-right: 4px solid gold;
    padding: 12px 20px;
    border-radius: 30px;
    z-index: 9999;
    animation: fadeUp 0.3s;
    font-size: 13px;
}
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}
.code-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #0f172a;
    border: 2px solid #fbbf24;
    border-radius: 48px;
    padding: 24px;
    z-index: 999999;
    text-align: center;
    width: 300px;
    box-shadow: 0 0 50px rgba(255,215,0,0.5);
}
.code-text {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
    background: #000000aa;
    padding: 12px;
    border-radius: 50px;
    margin: 12px 0;
    cursor: pointer;
    transition: 0.2s;
    color: #ffd966;
}
.win-loss-bar {
    display: flex;
    justify-content: space-between;
    background: #00000066;
    border-radius: 60px;
    padding: 10px 16px;
    margin-bottom: 15px;
    font-size: 14px;
    font-weight: bold;
    backdrop-filter: blur(4px);
}
.win-loss-bar span:first-child { color: #4ade80; }
.win-loss-bar span:last-child { color: #f87171; }
.hidden { display: none; }
</style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h2 style="color:#fbbf24; margin-bottom:8px;">👑 ICHANCY STORAGE 👑</h2>
        <input type="text" id="loginUser" placeholder="اسم المستخدم">
        <input type="password" id="loginPass" placeholder="كلمة المرور">
        <button id="doSignupBtn">➕ إنشاء حساب جديد</button>
        <button id="doLoginBtn">🔐 تسجيل الدخول</button>
    </div>
</div>

<div id="kingModal" class="king-modal">
    <h1>🎉 JACKPOT 🎉</h1>
    <p style="color:gold; margin-top:12px;">فوز أسطوري بالعجلة</p>
</div>

<div class="container">
    <div class="top-bar">
        <div class="logo">👑 ICHANCY STORAGE</div>
        <div class="balance">💰 <span id="balanceSpan">0</span></div>
    </div>
    
    <!-- شريط الربح والخسارة -->
    <div class="win-loss-bar">
        <span>🏆 إجمالي الأرباح: <span id="totalWinSpan">0</span> ل.س</span>
        <span>💸 إجمالي الخسائر: <span id="totalLossSpan">0</span> ل.س</span>
    </div>
    
    <div class="stats-row">
        <span>🟢 المتصلون: <span id="onlineCount">187</span></span>
        <span>🏆 آخر فائز: <span id="lastWinnerSpan">---</span></span>
    </div>

    <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
        <button class="spin-btn" id="spinBtn">🎡 SPIN</button>
    </div>

    <div class="actions">
        <button id="giftCodeBtn">🎁 كود هدية</button>
        <button id="withdrawBtn">💸 سحب</button>
        <button id="logoutBtn">🚪 خروج</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h3 style="color:gold; margin-bottom:10px;">👑 لوحة المدير الذهبية</h3>
        <input type="number" id="giftAmountVal" placeholder="💰 قيمة الكود (ل.س)">
        <button id="createGiftAdminBtn">🎫 توليد كود هدية قابل للنسخ</button>
        <input type="text" id="targetUserName" placeholder="👤 اسم المستخدم المستهدف (مثال: admin)">
        <input type="number" id="chargeAmountVal" placeholder="💎 مبلغ الشحن">
        <button id="chargeUserAdminBtn">💎 شحن رصيد مستخدم</button>
        <button id="backupSystemBtn">📀 نسخة احتياطية JSON</button>
        <input type="file" id="restoreBackupInput" accept=".json" style="display:none;">
        <button id="restoreBackupBtn">🔄 استعادة نسخة</button>
    </div>

    <div id="messageBox" class="message"></div>
</div>

<audio id="spinSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" preload="auto"></audio>
<audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" preload="auto"></audio>

<script>
    // ========================== أجزاء العجلة (0, 200, 3000, 50000) ==========================
    const SEGMENTS = [
        { name: "0", value: 0, color: "#111827" },
        { name: "200", value: 200, color: "#b45309" },
        { name: "0", value: 0, color: "#1e293b" },
        { name: "3000", value: 3000, color: "#d97706" },
        { name: "0", value: 0, color: "#111827" },
        { name: "50000", value: 50000, color: "#ea580c" }
    ];
    const SEG_ANGLE = 360 / SEGMENTS.length;
    let currentRotation = 0;
    let spinning = false;
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    // ======================== نظام التخزين (user.json / cod.json / info.json) ========================
    let usersDB = JSON.parse(localStorage.getItem('ICHANCY_USERS')) || {};
    let giftCodesDB = JSON.parse(localStorage.getItem('ICHANCY_GIFTCODES')) || {};
    let infoDB = JSON.parse(localStorage.getItem('ICHANCY_INFO')) || { totalCodesUsed: 0, totalUsers: 0 };
    
    let currentUser = null;
    const GAME_PRICE = 1000;
    const MIN_WITHDRAW = 80000;

    function saveAllFiles() {
        localStorage.setItem('ICHANCY_USERS', JSON.stringify(usersDB));
        localStorage.setItem('ICHANCY_GIFTCODES', JSON.stringify(giftCodesDB));
        localStorage.setItem('ICHANCY_INFO', JSON.stringify(infoDB));
        console.log("✅ تم الحفظ في user.json / cod.json / info.json");
    }
    
    function updateInfoStats() {
        infoDB.totalUsers = Object.keys(usersDB).length;
        saveAllFiles();
    }

    // رسم العجلة
    function drawWheel() {
        const size = canvas.width;
        const center = size / 2;
        const radius = size / 2 - 12;
        ctx.clearRect(0, 0, size, size);
        for (let i = 0; i < SEGMENTS.length; i++) {
            const start = (i * SEG_ANGLE + currentRotation) * Math.PI / 180;
            const end = ((i + 1) * SEG_ANGLE + currentRotation) * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, start, end);
            ctx.fillStyle = SEGMENTS[i].color;
            ctx.fill();
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate((start + end) / 2);
            ctx.fillStyle = "#FFD966";
            ctx.font = "bold 20px 'Segoe UI'";
            ctx.fillText(SEGMENTS[i].name, radius / 2 - 20, 8);
            ctx.restore();
            ctx.strokeStyle = "#fbbf24";
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, start, end);
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(center, center, 15, 0, 2 * Math.PI);
        ctx.fillStyle = "#FFD700";
        ctx.fill();
    }
    drawWheel();

    function showMessage(msg, isError = false) {
        const box = document.getElementById('messageBox');
        box.innerHTML = msg;
        box.className = `message ${isError ? 'error' : ''}`;
        box.style.display = 'block';
        setTimeout(() => box.style.display = 'none', 3200);
    }

    function updateBalanceUI() {
        if (currentUser) {
            document.getElementById('balanceSpan').innerText = currentUser.balance.toLocaleString();
            document.getElementById('totalWinSpan').innerText = (currentUser.totalWin || 0).toLocaleString();
            document.getElementById('totalLossSpan').innerText = (currentUser.totalLoss || 0).toLocaleString();
            if (!currentUser.isAdmin && usersDB[currentUser.name]) {
                usersDB[currentUser.name].balance = currentUser.balance;
                usersDB[currentUser.name].totalWin = currentUser.totalWin || 0;
                usersDB[currentUser.name].totalLoss = currentUser.totalLoss || 0;
                saveAllFiles();
            }
        }
    }

    // إنشاء حساب جديد (يتم الحفظ فوراً في user.json)
    function handleSignup() {
        const name = document.getElementById('loginUser').value.trim();
        const pwd = document.getElementById('loginPass').value.trim();
        if (!name || !pwd) { showMessage("❌ املأ جميع الحقول", true); return; }
        if (usersDB[name]) { showMessage("❌ هذا الاسم موجود مسبقاً في user.json", true); return; }
        
        usersDB[name] = { 
            password: pwd, 
            balance: 0, 
            totalWin: 0, 
            totalLoss: 0,
            createdAt: new Date().toISOString() 
        };
        updateInfoStats();
        saveAllFiles();
        showMessage(`✅ تم إنشاء حساب جديد: ${name} - يمكنك الآن تسجيل الدخول`);
    }

    // تسجيل الدخول (يجب أن يكون الحساب موجود مسبقاً في user.json)
    function handleLogin() {
        const name = document.getElementById('loginUser').value.trim();
        const pwd = document.getElementById('loginPass').value.trim();
        if (!name || !pwd) { showMessage("❌ املأ جميع الحقول", true); return; }
        
        // المدير الخاص (مدمج)
        if (name === "admin" && pwd === "admin099") {
            currentUser = { name: "admin", balance: 0, isAdmin: true, totalWin: 0, totalLoss: 0 };
            document.getElementById('adminPanel').style.display = "block";
            document.getElementById('balanceSpan').innerText = "0";
            document.getElementById('loginOverlay').style.display = "none";
            showMessage("✅ مرحباً أيها المدير - ملفات التخزين user.json / cod.json / info.json تعمل");
            updateBalanceUI();
            return;
        }
        
        // مستخدم عادي (يجب أن يكون مسجلاً مسبقاً)
        if (usersDB[name] && usersDB[name].password === pwd) {
            currentUser = { 
                name: name, 
                balance: usersDB[name].balance, 
                isAdmin: false,
                totalWin: usersDB[name].totalWin || 0,
                totalLoss: usersDB[name].totalLoss || 0
            };
            document.getElementById('balanceSpan').innerText = currentUser.balance;
            document.getElementById('loginOverlay').style.display = "none";
            document.getElementById('adminPanel').style.display = "none";
            showMessage(`✅ تم تسجيل الدخول بنجاح، مرحباً ${name}`);
            updateBalanceUI();
        } else {
            showMessage("❌ اسم المستخدم أو كلمة المرور غير صحيحة (الحساب غير موجود)", true);
        }
    }

    function logout() {
        currentUser = null;
        document.getElementById('loginOverlay').style.display = "flex";
        document.getElementById('adminPanel').style.display = "none";
        location.reload();
    }

    // دوران العجلة (تتوقف على 0 فقط، مع تحديث الأرباح/الخسائر)
    function spinWheel() {
        if (spinning) return;
        if (!currentUser) { showMessage("يجب تسجيل الدخول أولاً", true); return; }
        if (currentUser.balance < GAME_PRICE) { showMessage(`الرصيد غير كافي، تحتاج ${GAME_PRICE} ل.س`, true); return; }

        spinning = true;
        const spinAudio = document.getElementById('spinSound');
        if (spinAudio) spinAudio.play().catch(e=>{});

        // خصم ثمن اللعبة (خسارة ثابتة)
        currentUser.balance -= GAME_PRICE;
        currentUser.totalLoss = (currentUser.totalLoss || 0) + GAME_PRICE;
        updateBalanceUI();

        const zeroSlots = [0, 2, 4];
        const selectedZero = zeroSlots[Math.floor(Math.random() * zeroSlots.length)];
        const targetAngleCal = (selectedZero * SEG_ANGLE) + (SEG_ANGLE / 2);
        const currentAng = (360 - (currentRotation % 360)) % 360;
        let deltaMove = (targetAngleCal - currentAng + 360) % 360;
        let fullSpin = 360 * 7 + deltaMove;
        let newRot = currentRotation + fullSpin;

        canvas.style.transition = "transform 4s cubic-bezier(0.2, 0.9, 0.1, 1)";
        canvas.style.transform = `rotate(${newRot}deg)`;

        setTimeout(() => {
            currentRotation = newRot % 360;
            canvas.style.transition = "";
            canvas.style.transform = `rotate(${currentRotation}deg)`;
            drawWheel();
            
            // العجلة توقفت على 0 - لا ربح إضافي
            showMessage("😢 العجلة توقفت على 0 .. لم تكسب هذه المرة", true);
            spinning = false;
        }, 4000);
    }

    // إنشاء كود هدية (يتم حفظه في cod.json ويُستخدم مرة واحدة فقط)
    function createGiftCodeByAdmin() {
        if (!currentUser || !currentUser.isAdmin) { showMessage("غير مصرح (للمدير فقط)", true); return; }
        let val = parseInt(document.getElementById('giftAmountVal').value);
        if (!val || val <= 0) { showMessage("أدخل قيمة صحيحة للكود", true); return; }
        let code = "GIFT" + Math.random().toString(36).substring(2, 10).toUpperCase();
        giftCodesDB[code] = { value: val, used: false, creator: "admin", createdAt: new Date().toISOString() };
        saveAllFiles();

        const popup = document.createElement('div');
        popup.className = 'code-popup';
        popup.innerHTML = `
            <div style="font-size:22px; color:gold;">🎁 كود الهدية (مرة واحدة)</div>
            <div class="code-text" id="popupCodeText">${code}</div>
            <div>💰 القيمة: ${val.toLocaleString()} ل.س</div>
            <div style="font-size:12px; color:#aaa;">✨ اضغط على الكود لنسخه | يستخدم مرة واحدة فقط</div>
            <button id="closeCodePopupBtn" style="background:#fbbf24; border:none; padding:8px 20px; border-radius:40px; margin-top:12px;">إغلاق</button>
        `;
        document.body.appendChild(popup);
        const codeSpan = document.getElementById('popupCodeText');
        codeSpan.onclick = () => {
            navigator.clipboard.writeText(code);
            showMessage("📋 تم نسخ الكود (cod.json)");
        };
        document.getElementById('closeCodePopupBtn').onclick = () => popup.remove();
        document.getElementById('giftAmountVal').value = '';
    }

    // استعمال كود هدية (مرة واحدة فقط، يضاف الرصيد للمستخدم)
    function redeemGift() {
        if (!currentUser) { showMessage("سجل الدخول أولاً", true); return; }
        let code = prompt("🎫 أدخل كود الهدية:");
        if (!code) return;
        code = code.trim().toUpperCase();
        if (giftCodesDB[code] && !giftCodesDB[code].used) {
            const reward = giftCodesDB[code].value;
            giftCodesDB[code].used = true;
            giftCodesDB[code].usedBy = currentUser.name;
            giftCodesDB[code].usedAt = new Date().toISOString();
            currentUser.balance += reward;
            currentUser.totalWin = (currentUser.totalWin || 0) + reward;
            updateBalanceUI();
            saveAllFiles();
            showMessage(`✅ تم تفعيل الكود! +${reward.toLocaleString()} ل.س (تم تسجيل الاستخدام في cod.json)`);
        } else {
            showMessage("❌ كود غير صالح أو مستخدم مسبقاً (cod.json)", true);
        }
    }

    // سحب الرصيد
    function requestWithdrawal() {
        if (!currentUser) { showMessage("تسجيل الدخول مطلوب", true); return; }
        if (currentUser.balance < MIN_WITHDRAW) {
            showMessage(`الحد الأدنى للسحب ${MIN_WITHDRAW.toLocaleString()} ل.س`, true);
            return;
        }
        let wdCode = "WD" + Math.random().toString(36).substring(2, 10).toUpperCase();
        showMessage(`✅ تم إنشاء كود السحب: ${wdCode} (تواصل مع الدعم)`, false);
    }

    // شحن المستخدمين (يضاف مباشرة في user.json)
    function adminChargeTarget() {
        if (!currentUser || !currentUser.isAdmin) { showMessage("غير مصرح", true); return; }
        let targetName = document.getElementById('targetUserName').value.trim();
        let amount = parseInt(document.getElementById('chargeAmountVal').value);
        if (!targetName || !amount || amount <= 0) { showMessage("بيانات غير صحيحة", true); return; }
        if (usersDB[targetName]) {
            usersDB[targetName].balance += amount;
            saveAllFiles();
            if (currentUser.name === targetName && !currentUser.isAdmin) {
                currentUser.balance = usersDB[targetName].balance;
                updateBalanceUI();
            }
            showMessage(`✅ تم شحن ${amount.toLocaleString()} ل.س للمستخدم ${targetName} (تم التحديث في user.json)`);
        } else {
            showMessage("المستخدم غير موجود في user.json", true);
        }
        document.getElementById('chargeAmountVal').value = '';
    }

    // النسخ الاحتياطي
    function backupSystem() {
        const allData = { users: usersDB, giftCodes: giftCodesDB, info: infoDB };
        const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `ichancy_full_backup_${new Date().toISOString().slice(0,19)}.json`;
        a.click();
        showMessage("✅ تم تحميل النسخة الاحتياطية (user.json + cod.json + info.json)");
    }

    function restoreBackup() {
        const input = document.getElementById('restoreBackupInput');
        input.click();
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.users) usersDB = data.users;
                    if (data.giftCodes) giftCodesDB = data.giftCodes;
                    if (data.info) infoDB = data.info;
                    saveAllFiles();
                    showMessage("✅ استعادة البيانات بنجاح (user.json, cod.json, info.json)");
                    if (currentUser && !currentUser.isAdmin && usersDB[currentUser.name]) {
                        currentUser.balance = usersDB[currentUser.name].balance;
                        currentUser.totalWin = usersDB[currentUser.name].totalWin || 0;
                        currentUser.totalLoss = usersDB[currentUser.name].totalLoss || 0;
                        updateBalanceUI();
                    }
                } catch(e) { showMessage("ملف تالف", true); }
            };
            reader.readAsText(file);
        };
    }

    // تأثيرات وهمية
    setInterval(() => {
        document.getElementById('onlineCount').innerText = Math.floor(Math.random() * 150) + 130;
    }, 5000);
    const fakeWinners = ["أسد", "ريم", "ليث", "نور", "كينغ", "سيف"];
    setInterval(() => {
        let div = document.createElement('div');
        div.className = 'fake-toast';
        let name = fakeWinners[Math.floor(Math.random() * fakeWinners.length)];
        let value = [5000, 10000, 15000][Math.floor(Math.random() * 3)];
        div.innerHTML = `🎉 ${name} ربح ${value.toLocaleString()} ل.س من العجلة!`;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 4500);
    }, 13000);

    // ربط الأزرار
    document.getElementById('doSignupBtn').onclick = handleSignup;
    document.getElementById('doLoginBtn').onclick = handleLogin;
    document.getElementById('spinBtn').onclick = spinWheel;
    document.getElementById('giftCodeBtn').onclick = redeemGift;
    document.getElementById('withdrawBtn').onclick = requestWithdrawal;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('createGiftAdminBtn').onclick = createGiftCodeByAdmin;
    document.getElementById('chargeUserAdminBtn').onclick = adminChargeTarget;
    document.getElementById('backupSystemBtn').onclick = backupSystem;
    document.getElementById('restoreBackupBtn').onclick = restoreBackup;

    drawWheel();
    updateInfoStats();
    if (!currentUser) document.getElementById('loginOverlay').style.display = "flex";
    else document.getElementById('loginOverlay').style.display = "none";
</script>
</body>
</html>
