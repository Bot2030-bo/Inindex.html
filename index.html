<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>
ICHANCY STORAGE | العجلة الذهبية
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI','Tahoma',system-ui;
-webkit-tap-highlight-color:transparent;
}

body{
background:
radial-gradient(circle at 30% 10%,#0a0f1e,#030614);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:16px;
overflow-x:hidden;
}

.container{
max-width:520px;
width:100%;
margin:auto;
background:rgba(5,10,25,.55);
backdrop-filter:blur(14px);
border-radius:55px;
padding:20px 18px 30px;
border:1px solid rgba(255,215,0,.35);
box-shadow:0 25px 45px rgba(0,0,0,.5);
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.5);
border-radius:100px;
padding:8px 18px;
margin-bottom:20px;
}

.logo{
font-size:20px;
font-weight:bold;
background:linear-gradient(135deg,#ffd966,#ffb347);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.balance{
background:#0a2a3f;
padding:6px 14px;
border-radius:40px;
color:#ffd966;
font-weight:bold;
border:1px solid #1e6f9f;
}

.stats-row{
display:flex;
justify-content:space-between;
background:rgba(255,255,255,.05);
padding:10px 18px;
border-radius:60px;
margin-bottom:22px;
font-size:13px;
color:white;
}

.wheel-box{
position:relative;
width:300px;
height:300px;
margin:20px auto;
}

canvas{
width:100%!important;
height:100%!important;
border-radius:50%;
box-shadow:
0 0 0 6px rgba(255,215,0,.3),
0 15px 35px black;
background:#0e1622;
transition:transform 6s cubic-bezier(.2,.95,.1,1);
}

.pointer{
position:absolute;
top:-22px;
left:50%;
transform:translateX(-50%);
width:0;
height:0;
border-left:18px solid transparent;
border-right:18px solid transparent;
border-top:44px solid #fbbf24;
z-index:12;
}

.spin-btn{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:78px;
height:78px;
background:radial-gradient(circle,#ffd966,#f59e0b);
border:3px solid white;
border-radius:50%;
font-weight:bold;
font-size:20px;
cursor:pointer;
z-index:20;
box-shadow:0 0 18px gold;
}

.actions{
display:flex;
gap:12px;
margin:24px 0 15px;
}

.actions button,
.login-card button,
.admin-panel button{
flex:1;
background:#1e2a3a;
border:none;
padding:12px;
border-radius:50px;
color:white;
font-weight:bold;
cursor:pointer;
border:1px solid rgba(255,215,0,.4);
}

.login-card button{
background:#fbbf24;
color:black;
}

.login-overlay{
position:fixed;
inset:0;
background:#020617ee;
backdrop-filter:blur(14px);
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
}

.login-card{
width:88%;
max-width:360px;
background:#0f172a;
border-radius:55px;
padding:30px 24px;
text-align:center;
border:1px solid #fbbf24;
}

.login-card input,
.admin-panel input{
width:100%;
padding:14px;
margin:12px 0;
border-radius:60px;
background:#1e293b;
border:none;
color:white;
text-align:center;
}

.admin-panel{
margin-top:20px;
background:#0f1422cc;
border-radius:32px;
padding:18px;
border:1px solid #fbbf24;
display:none;
}

.top-message{
background:#1e293b;
border-radius:40px;
padding:10px;
margin-bottom:15px;
text-align:center;
font-size:14px;
font-weight:bold;
color:white;
}

.success{
background:#14532d!important;
}

.error{
background:#7f1d1d!important;
}

.hidden{
display:none;
}

.fake-toast{
position:fixed;
left:16px;
bottom:20px;
background:#0f172a;
border-right:4px solid gold;
padding:12px 20px;
border-radius:30px;
z-index:9999;
font-size:13px;
color:white;
animation:fadeUp .3s;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div id="loginOverlay" class="login-overlay">

<div class="login-card">

<h2 style="color:#fbbf24;margin-bottom:10px;">
👑 ICHANCY STORAGE 👑
</h2>

<input type="text"
id="loginUser"
placeholder="اسم المستخدم">

<input type="password"
id="loginPass"
placeholder="كلمة المرور">

<button id="doSignupBtn">
➕ إنشاء حساب
</button>

<button id="doLoginBtn"
style="margin-top:10px;">
🔐 تسجيل الدخول
</button>

</div>
</div>

<div class="container">

<div id="topMessage"
class="top-message hidden">
</div>

<div class="top-bar">

<div class="logo">
👑 ICHANCY STORAGE
</div>

<div class="balance">
💰
<span id="balanceSpan">0</span>
</div>

</div>

<div class="stats-row">

<span>
🟢 المتصلون:
<span id="onlineCount">187</span>
</span>

<span>
🏆 آخر فائز:
<span id="lastWinnerSpan">---</span>
</span>

</div>

<div class="wheel-box">

<div class="pointer"></div>

<canvas id="wheelCanvas"
width="500"
height="500">
</canvas>

<button class="spin-btn"
id="spinBtn">
🎡
</button>

</div>

<div class="actions">

<button id="giftCodeBtn">
🎁 كود
</button>

<button id="withdrawBtn">
💸 سحب
</button>

<button id="logoutBtn">
🚪 خروج
</button>

</div>

<div id="adminPanel"
class="admin-panel">

<h3 style="color:gold;margin-bottom:10px;">
👑 لوحة المدير
</h3>

<input type="number"
id="giftAmountVal"
placeholder="قيمة الكود">

<button id="createGiftAdminBtn">
🎫 إنشاء كود هدية
</button>

<input type="text"
id="targetUserName"
placeholder="اسم المستخدم">

<input type="number"
id="chargeAmountVal"
placeholder="قيمة الشحن">

<button id="chargeUserAdminBtn">
💎 شحن المستخدم
</button>

</div>

</div>

<script>

const SEGMENTS = [

{name:"0",color:"#111827"},
{name:"500",color:"#b45309"},
{name:"0",color:"#1e293b"},
{name:"1000",color:"#d97706"},
{name:"0",color:"#111827"},
{name:"2000",color:"#ea580c"}

];

const SEG_ANGLE =
360 / SEGMENTS.length;

const canvas =
document.getElementById(
'wheelCanvas'
);

const ctx =
canvas.getContext('2d');

let currentRotation = 0;

let spinning = false;

let currentUser = null;

const GAME_PRICE = 1000;

const MAX_BALANCE = 20000;

let usersDB =
JSON.parse(
localStorage.getItem(
'ICHANCY_USERS'
)
) || {};

let giftCodesDB =
JSON.parse(
localStorage.getItem(
'ICHANCY_GIFTCODES'
)
) || {};

function saveAllFiles(){

localStorage.setItem(
'ICHANCY_USERS',
JSON.stringify(usersDB)
);

localStorage.setItem(
'ICHANCY_GIFTCODES',
JSON.stringify(giftCodesDB)
);

}

function showTopMessage(
msg,
type=""
){

const box =
document.getElementById(
'topMessage'
);

box.innerHTML = msg;

box.className =
`top-message ${type}`;

box.classList.remove(
'hidden'
);

clearTimeout(box.timer);

box.timer = setTimeout(()=>{

box.classList.add(
'hidden'
);

},3500);

}

function drawWheel(){

const size = canvas.width;

const center = size / 2;

const radius =
size / 2 - 12;

ctx.clearRect(
0,
0,
size,
size
);

for(
let i=0;
i<SEGMENTS.length;
i++
){

const start =
(i*SEG_ANGLE)
*Math.PI/180;

const end =
((i+1)*SEG_ANGLE)
*Math.PI/180;

ctx.beginPath();

ctx.moveTo(
center,
center
);

ctx.arc(
center,
center,
radius,
start,
end
);

ctx.fillStyle =
SEGMENTS[i].color;

ctx.fill();

ctx.save();

ctx.translate(
center,
center
);

ctx.rotate(
(start+end)/2
);

ctx.fillStyle =
"#FFD966";

ctx.font =
"bold 20px Segoe UI";

ctx.fillText(
SEGMENTS[i].name,
radius/2-20,
8
);

ctx.restore();

}

}

drawWheel();

function updateBalanceUI(){

if(!currentUser) return;

if(currentUser.balance > 20000){

currentUser.balance = 20000;

}

if(currentUser.balance < 0){

currentUser.balance = 0;

}

document.getElementById(
'balanceSpan'
).innerText =
currentUser.balance.toLocaleString();

if(!currentUser.isAdmin){

usersDB[currentUser.name].balance =
currentUser.balance;

saveAllFiles();

}

}

function handleSignup(){

const name =
document.getElementById(
'loginUser'
).value.trim();

const pwd =
document.getElementById(
'loginPass'
).value.trim();

if(!name || !pwd){

showTopMessage(
"❌ الرجاء ملء جميع الحقول",
"error"
);

return;

}

if(usersDB[name]){

showTopMessage(
"❌ الحساب مستخدم مسبقاً",
"error"
);

return;

}

usersDB[name] = {

password:pwd,
balance:0

};

saveAllFiles();

showTopMessage(
"✅ تم إنشاء الحساب",
"success"
);

}

function handleLogin(){

const name =
document.getElementById(
'loginUser'
).value.trim();

const pwd =
document.getElementById(
'loginPass'
).value.trim();

if(
name==="admin"
&&
pwd==="admin099"
){

currentUser = {

name:"admin",
balance:0,
isAdmin:true

};

document.getElementById(
'adminPanel'
).style.display = "block";

document.getElementById(
'loginOverlay'
).style.display = "none";

showTopMessage(
"✅ دخول المدير",
"success"
);

return;

}

if(!usersDB[name]){

showTopMessage(
"❌ الحساب غير موجود",
"error"
);

return;

}

if(
usersDB[name].password
!== pwd
){

showTopMessage(
"❌ كلمة المرور خاطئة",
"error"
);

return;

}

currentUser = {

name:name,

balance:
usersDB[name].balance || 0,

isAdmin:false

};

document.getElementById(
'loginOverlay'
).style.display = "none";

updateBalanceUI();

showTopMessage(
`✅ مرحباً ${name}`,
"success"
);

}

function spinWheel(){

if(spinning) return;

if(!currentUser){

showTopMessage(
"❌ سجل الدخول أولاً",
"error"
);

return;

}

if(currentUser.balance < GAME_PRICE){

showTopMessage(
"❌ الرصيد غير كافي",
"error"
);

return;

}

spinning = true;

currentUser.balance -= GAME_PRICE;

if(currentUser.balance < 0){

currentUser.balance = 0;

}

updateBalanceUI();

let reward = 0;

if(currentUser.balance >= 20000){

reward = 0;

}

else if(currentUser.balance >= 10000){

const results = [

0,0,0,500,0,1000,0,0

];

reward = results[
Math.floor(
Math.random() *
results.length
)
];

}

else if(currentUser.balance >= 5000){

const results = [

0,
500,
1000,
1500,
2000,
3000,
0,
0,
500

];

reward = results[
Math.floor(
Math.random() *
results.length
)
];

}

else{

const results = [

0,
500,
1000,
1500,
2000,
3000,
4000,
5000

];

reward = results[
Math.floor(
Math.random() *
results.length
)
];

}

if(currentUser.balance + reward > 20000){

reward = 0;

}

let selectedIndex = 0;

if(reward > 0){

const winIndexes = [1,3,5];

selectedIndex = winIndexes[
Math.floor(
Math.random() *
winIndexes.length
)
];

}

else{

const loseIndexes = [0,2,4];

selectedIndex = loseIndexes[
Math.floor(
Math.random() *
loseIndexes.length
)
];

}

currentRotation =
currentRotation % 360;

const targetAngle =
(selectedIndex * SEG_ANGLE)
+
(SEG_ANGLE / 2);

const spins = 360 * 8;

const finalRotation =
currentRotation +
spins +
(360 - targetAngle);

currentRotation = finalRotation;

canvas.style.transition =
"transform 6s cubic-bezier(.2,.95,.1,1)";

canvas.style.transform =
`rotate(${finalRotation}deg)`;

setTimeout(()=>{

if(reward > 0){

currentUser.balance += reward;

if(currentUser.balance > 20000){

currentUser.balance = 20000;

}

showTopMessage(
`🎉 ربحت ${reward.toLocaleString()} ل.س`,
"success"
);

}

else{

showTopMessage(
"😢 خسرت هذه الجولة",
"error"
);

}

updateBalanceUI();

saveAllFiles();

spinning = false;

canvas.style.transition = "none";

currentRotation =
currentRotation % 360;

canvas.style.transform =
`rotate(${currentRotation}deg)`;

},6000);

}

function redeemGift(){

if(!currentUser){

showTopMessage(
"❌ سجل الدخول",
"error"
);

return;

}

let code =
prompt(
"🎁 أدخل الكود"
);

if(!code) return;

code =
code.trim()
.toUpperCase();

if(
giftCodesDB[code]
&&
!giftCodesDB[code].used
){

giftCodesDB[code].used = true;

let amount =
giftCodesDB[code].value;

if(
currentUser.balance + amount
> 20000
){

amount =
20000 -
currentUser.balance;

}

if(amount < 0){

amount = 0;

}

currentUser.balance += amount;

updateBalanceUI();

saveAllFiles();

showTopMessage(
`✅ تمت إضافة ${amount}`,
"success"
);

}

else{

showTopMessage(
"❌ كود غير صالح",
"error"
);

}

}

function createGiftCodeByAdmin(){

if(
!currentUser
||
!currentUser.isAdmin
) return;

let val = parseInt(

document.getElementById(
'giftAmountVal'
).value

);

if(!val || val<=0){

showTopMessage(
"❌ أدخل قيمة صحيحة",
"error"
);

return;

}

let code =
"GIFT"+
Math.random()
.toString(36)
.substring(2,10)
.toUpperCase();

giftCodesDB[code] = {

value:val,
used:false

};

saveAllFiles();

alert(
"🎁 كود الهدية:\n\n" + code
);

}

function adminChargeTarget(){

if(
!currentUser
||
!currentUser.isAdmin
) return;

let target =
document.getElementById(
'targetUserName'
).value.trim();

let amount =
parseInt(
document.getElementById(
'chargeAmountVal'
).value
);

if(!usersDB[target]){

showTopMessage(
"❌ المستخدم غير موجود",
"error"
);

return;

}

usersDB[target].balance += amount;

if(
usersDB[target].balance > 20000
){

usersDB[target].balance = 20000;

}

saveAllFiles();

showTopMessage(
"✅ تم الشحن",
"success"
);

}

function logout(){

location.reload();

}

setInterval(()=>{

document.getElementById(
'onlineCount'
).innerText =
Math.floor(
Math.random()*150
)+120;

},5000);

document.getElementById(
'doSignupBtn'
).onclick =
handleSignup;

document.getElementById(
'doLoginBtn'
).onclick =
handleLogin;

document.getElementById(
'spinBtn'
).onclick =
spinWheel;

document.getElementById(
'giftCodeBtn'
).onclick =
redeemGift;

document.getElementById(
'logoutBtn'
).onclick =
logout;

document.getElementById(
'createGiftAdminBtn'
).onclick =
createGiftCodeByAdmin;

document.getElementById(
'chargeUserAdminBtn'
).onclick =
adminChargeTarget;

</script>

</body>
</html>
